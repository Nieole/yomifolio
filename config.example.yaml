# Yomifolio 配置模板 / configuration template
#
# 用法：复制为 config.yaml 后按需修改（config.yaml 已被 .gitignore 忽略，不会入库）。
#   cp config.example.yaml config.yaml
# Usage: copy to config.yaml and edit as needed (config.yaml is gitignored).
#
# 首次启动时若 config.yaml 不存在，程序也会自动在工作目录生成一份默认配置。
# 本文件仅作为字段结构与默认值的参考，请勿在此填入真实密钥。
# 字段生效范围见设置页的“字段生效范围”或 GET /api/system/config 的 field_effects。
# 字段时机的权威定义位于 internal/config/effects.go。

server:
    host: 0.0.0.0
    port: 8080
    allowed_origins:
        - http://*
        - https://*
    # 可信反向代理的 CIDR 列表。只有直连对端落在这些网段内时，才采信
    # X-Forwarded-For / X-Real-IP 里的客户端 IP。留空 = 一律不信任转发头。
    # 限流（登录暴破、OPDS/Mihon 的 bcrypt CPU-DoS 防护）以客户端 IP 为分桶键，
    # 无条件采信转发头等于让攻击者换个头就换一个新桶。直连部署保持留空即可；
    # 套了 Nginx/Caddy/Traefik 的部署填上代理所在网段，例如：
    #   trusted_proxies: ["127.0.0.1/32", "::1/128", "172.17.0.0/16"]
    trusted_proxies: []
    # 会话 Cookie 的 Secure 标志由谁说了算：auto（默认）/ always / never。
    #
    #   auto   直连 TLS，或**可信**代理（见上面的 trusted_proxies）声明
    #          X-Forwarded-Proto: https 时才带 Secure。未登记的对端声明 https 会被忽略
    #          并在日志里告警一次 —— 否则任何客户端都能自己决定这个标志。
    #   always 无条件带。给「TLS 在反代终结、但不打算把反代网段填进 trusted_proxies」
    #          的部署一个明确出口：这两件事本来就是独立决定，不该被迫二选一。
    #   never  无条件不带。反向逃生口：反代错误地声明了 https 而实际服务明文时，
    #          Secure 会让浏览器直接丢弃 Cookie，登录彻底失效，这时需要能手动压回去。
    #
    # 反代终结 TLS 的部署二选一即可：要么把代理网段填进 trusted_proxies（同时也修好限流的真实 IP），
    # 要么在这里写 always。写错的值会回落 auto 并在启动日志告警。
    cookie_secure: auto
database:
    path: ./data/manga.db
library:
    paths: []
    storage_profile: auto
    io_policy:
        scan_concurrency: 0
        archive_open_concurrency: 0
        cover_concurrency: 0
        hash_concurrency: 0
        pause_background_when_reading: false
        idle_only_heavy_tasks: false
        disable_same_disk_page_cache: false
    storage_policies: []
cache:
    dir: ./data/cache
    page_disk_cache_enabled: false
scanner:
    workers: 0
    scan_profile: metadata_scan
    thumbnail_format: webp
    waifu2x_path: ""
    realcugan_path: ""
    archive_pool_size: 5
    max_ai_concurrency: 3
tasks:
    run_slots: 2
    # 运行历史的分层保留：每任务留最近几次运行、终态运行留几天、吞吐采样留几天，三个数都至少为 1
    retain_runs_per_task: 20
    retain_terminal_run_days: 90
    retain_sample_days: 7
    # 吞吐曲线的取点间隔（秒），至少为 1。只影响曲线的疏密，不影响进度与速率那几个数
    sample_interval_seconds: 10
    # 自动发起的退避：连败后间隔按倍率拉长、封顶多少小时、连败几次停发。三个数都至少为 1
    backoff_factor: 2
    backoff_max_hours: 24
    backoff_stop_after: 6
    # 重启后自己接着跑：扫描这类可续跑的工作自动重排队，改磁盘内容或花钱的那些停在中断等人裁决。
    # 不写就是开着
    resume_after_restart: true
ollama:
    endpoint: ""
    model: ""
llm:
    provider: ollama
    api_mode: ""
    base_url: http://localhost:11434
    request_path: ""
    endpoint: http://localhost:11434
    model: qwen2.5
    api_key: ""        # 切勿把真实密钥提交到版本库 / never commit a real API key
    timeout: 120
scrapers:
    # AniList / MangaDex 免密钥，无需配置。
    # MyAnimeList 需要 Client ID，Comic Vine 需要 API Key；留空则对应刮削源不可用。
    mal_client_id: ""       # 切勿把真实凭据提交到版本库 / never commit a real credential
    comicvine_api_key: ""   # 切勿把真实密钥提交到版本库 / never commit a real API key
identification:
    # 证据包预取向同一来源连发两次请求的最小间隔（毫秒）。0 取默认值，负数表示不限速。
    # Minimum milliseconds between two evidence prefetch requests to one source. 0 uses the default, negative disables spacing.
    source_intervals_ms:
        bangumi: 1000
        anilist: 2000       # AniList 目前限每分钟 30 次 / AniList currently allows 30 requests per minute
        mangadex: 1000
        myanimelist: 1000
        comicvine: 18000    # Comic Vine 限每资源每小时 200 次 / Comic Vine allows 200 requests per resource per hour
    # 识别补充取文本字段与作者的来源先后，排前的先取；没列出的来源按默认顺序接在后面。
    # Order identification enrichment takes text fields and authors in; unlisted sources follow in the default order.
    source_priority: [bangumi, anilist, mangadex, myanimelist, comicvine]
    # 识别补充追加来源标签前依次经过的三道过滤：投票阈值、屏蔽列表、每系列上限。只追加，不删除已有标签。
    # Filters identification enrichment applies, in order, before appending source tags; existing tags are never removed.
    tags:
        # 投票类来源（目前只有 Bangumi）的标签至少要有这么多票；其它来源的标签是编目分类，不看票数。
        # 0 取默认值，负数不设阈值。没有保存票数的旧证据里，Bangumi 标签在阈值开着时一律不追加。
        # Votes a tag needs from a source whose tags are votes (Bangumi). 0 uses the default, negative disables it.
        min_votes: 3
        # 不追加的标签，比较时忽略全半角、大小写、空白与标点；前后带 / 的条目是正则表达式，匹配同样处理过的标签。
        # 默认覆盖媒介、地区、年份、连载状态与个人状态。写成 [] 表示不屏蔽任何标签。
        # Tags never appended, compared ignoring width, case, whitespace and punctuation; /.../ is a regular expression.
        blocklist:
            # 媒介 / medium
            - 漫画
            - 漫畫
            - マンガ
            - まんが
            - コミック
            - 日漫
            - 国漫
            - 韩漫
            - 美漫
            - 港漫
            - 台漫
            - 条漫
            - 单行本
            - 轻小说
            - 小说
            - 画集
            - manga
            - manhwa
            - manhua
            - comic
            - comics
            - webtoon
            - web comic
            - long strip
            - full color
            - official colored
            # 地区 / region
            - 日本
            - 中国
            - 国产
            - 大陆
            - 台湾
            - 香港
            - 韩国
            - 美国
            - 欧美
            - 法国
            - japan
            - japanese
            - korea
            - korean
            - china
            - chinese
            # 年份：2010、2010年、2010年4月、2010年代、2010s；80年代、90s / years and decades
            - '/^(19|20)\d{2}(年代|s|年?(\d{1,2}月?)?)$/'
            - '/^\d{2}(年代|s)$/'
            # 连载状态 / publication status
            - 连载
            - 连载中
            - 完结
            - 已完结
            - 完結
            - 未完结
            # 个人状态 / a reader's own status
            - 已购
            - 已购入
            - 购入
            - 已买
            - 入手
            - 已入手
            - 收藏
            - 已收藏
            - 藏书
            - 实体书
            - 已读
            - 读过
            - 在读
            - 想读
            - 未读
            - 看过
            - 在看
            - 想看
            - 补完
            - 弃坑
            - 养肥
            - 追更
            - owned
            - read
            - reading
            - plan to read
            - dropped
            - favorite
        # 每个系列最多从来源选多少个标签（先按来源优先级、再按票数排序），系列已有的也算在内、不重复追加。
        # 0 取默认值，负数不设上限。
        # Source tags one series takes at most, by source priority then votes, counting those it already has.
        # 0 uses the default, negative disables the limit.
        max_per_series: 10
protocols:
    opds:
        enabled: false
    mihon:
        enabled: false
koreader:
    enabled: false
    base_path: /koreader
    allow_registration: false
    match_mode: binary_hash
    path_ignore_extension: false

# MCP is disabled until a canonical origin is configured. Endpoint: <origin>/mcp.
# 公网使用 HTTPS；反向代理须保留 Host、清除客户端转发头并设置可信代理。
# LAN example: public_url: http://192.168.1.20:8080 (literal private IP only).
# 明文可能导致凭据被截获；显式启用也不允许公网 HTTP。
mcp:
    public_url: ""
    allow_lan_http: false
