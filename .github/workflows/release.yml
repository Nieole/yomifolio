name: Server / Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (v*)
        type: string
        required: true

permissions:
  contents: read

# Serialize publication, including manual reruns; never cancel an active release.
concurrency:
  group: server-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve:
    name: Validate version tag and pin commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve existing version tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$REQUESTED_TAG"
          else
            [[ "$GITHUB_REF_TYPE" == "tag" ]] || exit 1
            TAG="$GITHUB_REF_NAME"
          fi
          [[ "$TAG" == v* ]] || exit 1
          git check-ref-format "refs/tags/$TAG"
          # Also keep the tag safe for binary filenames and linker values.
          [[ "$TAG" =~ ^v[A-Za-z0-9._+-]*$ ]] || exit 1
          SHA="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  ci:
    name: Full release validation
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      full: true

  package:
    name: Release binaries
    needs: [resolve, ci]
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.tag }}
      frontend-artifact: ${{ needs.ci.outputs.frontend-artifact }}

  publish:
    name: Publish version release
    needs: [resolve, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts only
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: yomifolio-*
          path: release-artifacts
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum yomifolio-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@28ab305d0ffa26d60ec4bd614126329e26c7a0ec # v3.0.4
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
