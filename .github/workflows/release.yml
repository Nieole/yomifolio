name: Server / Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (v*)
        type: string
        required: true

permissions:
  contents: read

# Serialize publication, including manual reruns; never cancel an active release.
concurrency:
  group: server-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve:
    name: Validate version tag and pin commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve existing version tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$REQUESTED_TAG"
          else
            [[ "$GITHUB_REF_TYPE" == "tag" ]] || exit 1
            TAG="$GITHUB_REF_NAME"
          fi
          [[ "$TAG" == v* ]] || exit 1
          git check-ref-format "refs/tags/$TAG"
          # Also keep the tag safe for binary filenames and linker values.
          [[ "$TAG" =~ ^v[A-Za-z0-9._+-]*$ ]] || exit 1
          SHA="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  ci:
    name: Full release validation
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      full: true

  package:
    name: Release binaries
    needs: [resolve, ci]
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.tag }}
      frontend-artifact: ${{ needs.ci.outputs.frontend-artifact }}

  notices:
    name: Prepare, download and verify associated notices; gate readiness
    needs: [resolve, package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Download native binaries and review metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: yomifolio-*
          path: release-artifacts
          merge-multiple: true
      - name: Create and extract byte-exact notice archive
        env:
          VERSION: ${{ needs.resolve.outputs.tag }}
        run: python3 scripts/release_notices.py create --version "$VERSION"
      - name: Upload associated same-version notice archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yomifolio-${{ needs.resolve.outputs.tag }}-notices
          path: release-artifacts/yomifolio-${{ needs.resolve.outputs.tag }}-notices.zip
          if-no-files-found: error
      - name: Download uploaded notices for extraction verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: yomifolio-${{ needs.resolve.outputs.tag }}-notices
          path: downloaded-notices
      - name: Verify actual downloaded archive and gate legal delivery
        # Legal texts, MPL source delivery, archive delivery and artifact integrity fail this gate;
        # prebuilt-input provenance is printed as a deferred risk and never certified here.
        env:
          VERSION: ${{ needs.resolve.outputs.tag }}
        run: |
          python3 scripts/release_notices.py verify --version "$VERSION" --artifacts downloaded-notices
          python3 scripts/release_notices.py gate --version "$VERSION"

  publish:
    name: Publish version release
    needs: [resolve, package, notices]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pinned release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Download binaries, metadata and associated notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: yomifolio-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify downloaded publication payload
        env:
          VERSION: ${{ needs.resolve.outputs.tag }}
        run: |
          python3 scripts/release_notices.py verify --version "$VERSION"
          python3 scripts/release_notices.py gate --version "$VERSION"
      - name: Generate SHA256 checksums
        run: |
          cd release-artifacts
          sha256sum yomifolio-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Compose release notes from the changelog
        env:
          VERSION: ${{ needs.resolve.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os, pathlib, sys

          version = os.environ["VERSION"]
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          prefix = "### \U0001F3F7\uFE0F "
          heading = f"{prefix}{version} "
          start = next((i for i, line in enumerate(lines) if line.startswith(heading)), None)
          if start is None:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          end = next(
              (j for j in range(start + 1, len(lines))
               if lines[j].startswith("### ") or lines[j].strip() == "---"),
              len(lines),
          )
          section = lines[start:end]
          while section and not section[-1].strip():
              section.pop()
          section[0] = "## " + section[0][len(prefix):]

          footer = f"""

          ## 下载与校验

          - `yomifolio-{version}-linux-amd64`、`yomifolio-{version}-windows-amd64.exe`、`yomifolio-{version}-darwin-arm64`：启用 CGO 的原生二进制。
          - `yomifolio-{version}-<target>.metadata.json`：对应二进制的构建来源——目标与 `go env`、编译器版本输出、动态依赖（`ldd`）、嵌入式 AVIF/WASI 输入的哈希、MPL 组件的对应源码归档及逐文件哈希。
          - `yomifolio-{version}-notices.zip`：本版本随二进制分发的第三方许可通知与适用全文。
          - `SHA256SUMS.txt`：下载后以 `sha256sum -c SHA256SUMS.txt` 校验。

          ## 已知限制

          - 尚无可复现构建与签名 attestation，二进制与源码输入之间只有记录、没有密码学证明。
          - 嵌入式 AVIF 预构建 WASM 的上游源码与工具链映射未解析，元数据中如实标注为未解析。
          - 通知包内仍有两处 NPM 位置只有元数据标签、缺适用全文；该残留风险在发布审查记录中标注为非阻断。
          """

          pathlib.Path("release-artifacts/RELEASE_NOTES.md").write_text(
              "\n".join(section) + footer, encoding="utf-8"
          )
          PY
          cat release-artifacts/RELEASE_NOTES.md
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.sha }}
          body_path: release-artifacts/RELEASE_NOTES.md
          files: release-artifacts/*
          fail_on_unmatched_files: true
          overwrite_files: true
