name: Server / Package

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      version:
        type: string
        required: true
      frontend-artifact:
        type: string
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  binaries:
    name: Package / ${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Download validated frontend from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.frontend-artifact }}
          path: web/dist
      - name: Build native CGO binary
        id: binary
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || exit 1
          EXT=""
          if [[ "$GOOS" == "windows" ]]; then EXT=".exe"; fi
          OUTPUT_NAME="yomifolio-${VERSION}-${GOOS}-${GOARCH}${EXT}"
          COMMIT="$(git rev-parse HEAD)"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p build
          go build -ldflags="-s -w -X 'main.Version=${VERSION}' -X 'main.Commit=${COMMIT}' -X 'main.BuildTime=${BUILD_TIME}'" -o "build/$OUTPUT_NAME" ./cmd/server
          echo "name=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"
      - name: Capture actual release inputs for notice review
        shell: bash
        env:
          OUTPUT_NAME: ${{ steps.binary.outputs.name }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release_build_metadata.py --binary "build/$OUTPUT_NAME" --version "$VERSION"
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.binary.outputs.name }}
          path: |
            build/${{ steps.binary.outputs.name }}
            build/${{ steps.binary.outputs.name }}.metadata.json
          if-no-files-found: error
