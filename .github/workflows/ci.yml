name: Server / Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      full:
        type: boolean
        default: true
    outputs:
      frontend-artifact:
        description: Frontend artifact from this workflow run
        value: ${{ jobs.frontend.outputs.artifact }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
      generated: ${{ steps.changes.outputs.generated }}
      security: ${{ steps.changes.outputs.security }}
      docs: ${{ steps.changes.outputs.docs }}
      workflows: ${{ steps.changes.outputs.workflows }}
      mihon: ${{ steps.changes.outputs.mihon }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || '' }}
      - name: Detect relevant changes
        id: changes
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || inputs.full == true }}
        run: |
          if [[ "$FULL" == "true" ]]; then
            python3 scripts/ci_changes.py --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT" --full
          else
            python3 scripts/ci_changes.py --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend / lint, test and static build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Lint frontend
        working-directory: web
        run: npm run lint
      - name: Test frontend
        working-directory: web
        run: npm run test
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Upload shared static assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-web-dist
          path: web/dist
          if-no-files-found: error
      - name: Export artifact name
        id: artifact
        run: echo "name=server-web-dist" >> "$GITHUB_OUTPUT"

  go-static:
    name: Go / static analysis
    needs: [changes, frontend]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Download frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.frontend.outputs.artifact }}
          path: web/dist
      - name: Lint Go
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.15.0

  go-native:
    name: Go / native vet, tests and CGO build (${{ matrix.os }})
    needs: [changes, frontend]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Download frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.frontend.outputs.artifact }}
          path: web/dist
      - name: Vet Go
        run: go vet ./...
      - name: Test Go
        run: go test ./...
      - name: Verify CGO server build
        env:
          CGO_ENABLED: "1"
        run: go build -o build/yomifolio-ci ./cmd/server

  race:
    name: Go / Linux race tests
    needs: [changes, frontend]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Download frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.frontend.outputs.artifact }}
          path: web/dist
      - name: Test with race detector
        run: go test -race -timeout=30m ./...

  security:
    name: Security / Go vulnerabilities
    needs: [changes, frontend]
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Download frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.frontend.outputs.artifact }}
          path: web/dist
      - name: Scan dependencies
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  generated:
    name: Generated / SQL and TypeScript drift
    needs: [changes, frontend]
    if: needs.changes.outputs.generated == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Download frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.frontend.outputs.artifact }}
          path: web/dist
      - name: Verify sqlc generated code
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          if [[ -n "$(git status --porcelain -- internal/database)" ]]; then
            git status --porcelain -- internal/database
            git diff -- internal/database
            exit 1
          fi
      - name: Verify generated TypeScript contracts
        run: |
          go run ./cmd/tsgen
          if [[ -n "$(git status --porcelain -- web/src/api/generated.ts)" ]]; then
            git status --porcelain -- web/src/api/generated.ts
            git diff -- web/src/api/generated.ts
            exit 1
          fi

  docs:
    name: Documentation / style
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Check documentation style
        run: ./scripts/check-doc-style.sh

  workflows:
    name: Workflows / regression tests and actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Test CI selection and workflow contracts
        run: python3 -m unittest discover -s scripts -p 'ci_*_test.py' -v
      - name: Check workflow syntax
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint

  checks:
    name: Server / required checks
    if: always()
    needs: [changes, frontend, go-static, go-native, race, security, generated, docs, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          assert needs['changes']['result'] == 'success', 'Change detection failed'
          flags = needs['changes']['outputs']
          categories = {
              'frontend': 'frontend', 'go-static': 'backend', 'go-native': 'backend',
              'race': 'backend', 'security': 'security', 'generated': 'generated',
              'docs': 'docs', 'workflows': 'workflows',
          }
          for job, flag in categories.items():
              assert flags.get(flag) in ('true', 'false'), f'Missing selection: {flag}'
              expected = 'success' if flags[flag] == 'true' else 'skipped'
              assert needs[job]['result'] == expected, f'{job}: {needs[job]["result"]}, expected {expected}'
          PYTHON
