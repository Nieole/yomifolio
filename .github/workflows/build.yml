name: Server / Manual test binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Full validation
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
      full: true

  package:
    name: Test binaries (not a release)
    needs: ci
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.sha }}
      version: manual-${{ github.run_number }}-${{ github.sha }}
      frontend-artifact: ${{ needs.ci.outputs.frontend-artifact }}
