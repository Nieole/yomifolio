name: Mihon signed repository publication

on:
  workflow_dispatch:

permissions:
  contents: read

# Serializes all releases, even dispatches selecting different refs; do not interrupt publication.
concurrency:
  group: mihon-repository-publication
  cancel-in-progress: false

jobs:
  build:
    # Never execute signing code from PRs, tags or non-default branches.
    if: github.repository == 'Nieole/yomifolio' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned build toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Tests and lint without secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s extensions/mihon/tools -v
          cd extensions/mihon
          bash ./gradlew --no-daemon :protocol-tests:test assembleDebug lint
      - name: Decode private keystore into runner temporary storage
        env:
          MIHON_KEYSTORE_BASE64: ${{ secrets.MIHON_KEYSTORE_BASE64 }}
          MIHON_KEYSTORE_PASSWORD: ${{ secrets.MIHON_KEYSTORE_PASSWORD }}
          MIHON_KEY_ALIAS: ${{ secrets.MIHON_KEY_ALIAS }}
          MIHON_KEY_PASSWORD: ${{ secrets.MIHON_KEY_PASSWORD }}
        run: python3 extensions/mihon/tools/prepare_signing.py
      - name: Build signed release (never pass secrets on command line)
        working-directory: extensions/mihon
        env:
          MIHON_KEYSTORE_BASE64: ${{ secrets.MIHON_KEYSTORE_BASE64 }}
          MIHON_KEYSTORE_PASSWORD: ${{ secrets.MIHON_KEYSTORE_PASSWORD }}
          MIHON_KEY_ALIAS: ${{ secrets.MIHON_KEY_ALIAS }}
          MIHON_KEY_PASSWORD: ${{ secrets.MIHON_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleRelease
      - name: Verify APK and prepare public-only handoff
        shell: bash
        run: |
          set -euo pipefail
          apk=extensions/mihon/build/outputs/apk/release/manga-manager-mihon-release.apk
          python3 extensions/mihon/tools/repository.py --apk "$apk" --tools "$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$RUNNER_TEMP/mihon-public/tools"
          cp "$apk" "$RUNNER_TEMP/mihon-public/release.apk"
          cp web/public/icons/icon-192.png "$RUNNER_TEMP/mihon-public/icon.png"
          cp extensions/mihon/tools/{repository,publish}.py "$RUNNER_TEMP/mihon-public/tools/"
      - name: Remove keystore even on failure
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mihon-release.keystore"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mihon-signed-publication
          path: ${{ runner.temp }}/mihon-public/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # GitHub permissions are job-level, not step-level. Only this job can write;
    # GH_TOKEN is exposed solely to the final publisher, never Gradle or PR code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mihon-signed-publication
          path: ${{ runner.temp }}/mihon-public
      - name: Select verifier toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Validate all published history then update mihon-repo without force
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/mihon-public/tools/publish.py" \
            --apk "$RUNNER_TEMP/mihon-public/release.apk" \
            --icon "$RUNNER_TEMP/mihon-public/icon.png" \
            --tools "$ANDROID_HOME/build-tools/35.0.0"
